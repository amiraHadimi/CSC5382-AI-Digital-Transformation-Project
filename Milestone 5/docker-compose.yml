services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama3sp_api
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: llama3sp_frontend
    ports:
      - "8501:8501"
    depends_on:
      - api